[alembic]
script_location = alembic
prepend_sys_path = .
# The real URL is injected from app settings (DATABASE_URL env / .env file)
# by alembic/env.py; this value is only a documentation fallback.
sqlalchemy.url = postgresql+asyncpg://ta_user:CHANGE_ME@localhost:5432/ta_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
